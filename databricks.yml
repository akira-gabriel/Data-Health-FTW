bundle:
  name: data-health-ftw

artifacts:
  data_health_ftw_wheel:
    type: whl
    build: python -m build --wheel
    path: .

resources:
  jobs:
    gho_pipeline:
      name: gho-pipeline
      tasks:
        - task_key: bronze_ingest
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: bronze-ingest
          environment_key: default

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: silver-transform
          environment_key: default

        - task_key: silver_validate
          depends_on:
            - task_key: silver_transform
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: silver-validate
          environment_key: default

        - task_key: gold_transform
          depends_on:
            - task_key: silver_validate
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: gold-transform
          environment_key: default

        - task_key: gold_validate
          depends_on:
            - task_key: gold_transform
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: gold-validate
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl

    # Separate job: loads the GHE death rates from the file in the volume and builds
    # gold.ml_features. It needs gold.gho_wide to exist (run gho_pipeline at least once).
    # Not tied to the GHO API, so it keeps working while that API is down.
    ml_features_pipeline:
      name: ml-features-pipeline
      tasks:
        - task_key: ghe_bronze_ingest
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: ghe-bronze-ingest
          environment_key: default

        - task_key: ghe_silver_transform
          depends_on:
            - task_key: ghe_bronze_ingest
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: ghe-silver-transform
          environment_key: default

        - task_key: ml_features_build
          depends_on:
            - task_key: ghe_silver_transform
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: ml-features-build
          environment_key: default

        - task_key: ml_features_validate
          depends_on:
            - task_key: ml_features_build
          python_wheel_task:
            package_name: data_health_ftw
            entry_point: ml-features-validate
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    mode: development
    default: true